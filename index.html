<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAFITA Tickets 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600&family=Oswald:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a class="brand" href="index.html"><span class="wordmark">LAFITA</span><span class="tag">Tickets</span></a>
    <div class="header-right">
      <div class="lang-switch"></div>
      <div class="header-dates">25.–29.11.2026<small data-i18n="header_sub"></small></div>
    </div>
  </div>
</header>

<section class="rec" aria-labelledby="rec-title">
  <div class="inner">
    <p class="rec-kicker" data-i18n="rec_kicker"></p>
    <h1 id="rec-title" data-i18n="rec_h1"></h1>
    <p class="rec-lead" data-i18n="rec_lead"></p>
    <form id="rec-form" class="rec-form" autocomplete="off">
      <label for="rec-q" class="sr-only" data-i18n="rec_label"></label>
      <textarea id="rec-q" rows="2" maxlength="300" data-i18n-ph="rec_ph"></textarea>
      <button class="btn" type="submit" data-i18n="rec_btn"></button>
    </form>
    <p class="rec-hint" data-i18n="rec_hint"></p>
    <div id="rec-out" aria-live="polite"></div>
  </div>
</section>

<section class="intro" id="programa-tickets">
  <div class="inner">
    <h2 class="intro-title" data-i18n="program_h2"></h2>
    <p>Lateinamerikanische Filmtage München · 25.–29.11.2026</p>
    <div class="how"><span data-i18n="step1"></span><span data-i18n="step2"></span><span data-i18n="step3"></span></div>
    <p class="home-manage" data-i18n="home_manage"></p>
    <div class="info-box">
      <div>
        <h2 data-i18n="hp8_title"></h2>
        <p data-i18n="hp8_text"></p>
      </div>
      <div>
        <h2 data-i18n="other_title"></h2>
        <p data-i18n="other_text"></p>
      </div>
    </div>
  </div>
</section>

<main>
  <div id="estado" class="alert info" data-i18n="loading_program"></div>
  <div id="programa"></div>
</main>

<footer class="site-footer">
  <div class="inner">
    <span>LAFITA · Lateinamerikanische Filmtage München</span>
    <span><a href="https://lafita.de">lafita.de</a> · <a href="admin.html">Team</a></span>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="i18n.js"></script>
<script src="plazas.js"></script>
<script src="recomendador.js"></script>
<script>
let peliculas = null;
let ocupadas = {};     // plazas ocupadas por función (en directo desde Firebase)

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function libresDe(p) { return capacidadDe(p) - (ocupadas[p.id] || 0); }
function lineaPlazas(p) {
  const n = libresDe(p);
  return `<p class="seats-line${n <= 0 ? ' full' : n <= 5 ? ' low' : ''}">${textoPlazas(n)}</p>`;
}

function botonTicket(p) {
  return p.enlaceExterno
    ? `<a class="btn secondary" href="${esc(p.enlaceExterno)}" target="_blank" rel="noopener">${t('btn_tickets')}</a>`
    : `<a class="btn${libresDe(p) <= 0 ? ' waitlist' : ''}" href="registro.html?pelicula=${encodeURIComponent(p.id)}&lang=${LANG}">${libresDe(p) <= 0 ? t('btn_waitlist') : t('btn_reserve')}</a>`;
}

// ---------- Recomendador ----------
const HOY = new Date().toISOString().slice(0, 10);
let consulta = '';     // último texto recomendado ('' = nada todavía)
let avisoVacio = false;
let ia = null;         // respuesta del servicio de IA: { consulta, lang, estado: 'pensando'|'ok'|'error', datos }
const abiertos = new Set();   // fichas "Trama y reparto" abiertas (se mantienen al refrescar plazas)

// Trama, dirección y reparto (plegable)
function fichaPelicula(p, clave) {
  const trama = p.trama && (p.trama[LANG] || p.trama.de);
  if (!trama && !p.reparto) return '';
  const id = clave + p.id;
  return `<details class="film-more" data-k="${esc(id)}"${abiertos.has(id) ? ' open' : ''}>
    <summary>${t('info_toggle')}</summary>
    ${trama ? `<p>${esc(trama)}</p>` : ''}
    <p class="film-credits">
      ${p.direccion ? `<span><b>${t('lbl_dir')}:</b> ${esc(p.direccion)}</span>` : ''}
      ${p.reparto && p.reparto.length ? `<span><b>${t('lbl_cast')}:</b> ${esc(p.reparto.join(', '))}</span>` : ''}
    </p>
  </details>`;
}

function tarjeta(p, i, si, no, extra) {
  return `
    <li class="rec-card${no.length ? ' partial' : ''}">
      <span class="rec-rank">${i + 1}</span>
      <div class="rec-body">
        <p class="rec-when">${diaCorto(p.fecha)} · ${esc(p.hora)}${t('time_suffix')} · ${esc(p.lugar)}</p>
        <h3 class="film-title">${esc(p.titulo)}</h3>
        <p class="film-meta">${esc(p.sinopsis)}</p>
        <ul class="rec-why">
          ${si.map(x => `<li class="ok">${esc(x)}</li>`).join('')}
          ${no.map(x => `<li class="warn">${esc(x)}</li>`).join('')}
          <li class="info">${esc(extra)}</li>
        </ul>
        ${fichaPelicula(p, 'rec-')}
        <div class="rec-actions">
          ${botonTicket(p)}
          <a class="link-btn" href="#f-${esc(p.id)}">${t('rec_see')} ↓</a>
        </div>
      </div>
    </li>`;
}

function infoPractica(p) {
  const n = libresDe(p);
  if (p.enlaceExterno) return t('r_online');
  if (n <= 0) return t('r_full');
  return n === 1 ? t('r_seats_one') : t('r_seats', { n });
}

// Resultado del servicio de IA (si está configurado y respondió)
function renderIA(out) {
  if (ia.estado === 'pensando') { out.innerHTML = `<p class="rec-msg rec-thinking">${t('rec_thinking')}</p>`; return true; }
  if (ia.estado !== 'ok') return false;
  const lista = (ia.datos.recomendaciones || [])
    .map(r => ({ p: peliculas.find(x => x.id === r.id), razon: r.razon }))
    .filter(r => r.p && r.p.fecha >= HOY).slice(0, 3);
  if (!lista.length) return false;   // sin nada útil: mejor el motor local
  out.innerHTML = `
    ${ia.datos.entendido ? `<p class="rec-understood"><span>${t('rec_understood')}</span> <span class="tagx">${esc(ia.datos.entendido)}</span></p>` : ''}
    <h2 class="rec-results-title">${t('rec_results')}</h2>
    <ol class="rec-list">${lista.map((r, i) => tarjeta(r.p, i, [r.razon], [], infoPractica(r.p))).join('')}</ol>
    <p class="rec-msg rec-ai-note">${t('rec_ai_note')}</p>`;
  return true;
}

function renderRecomendaciones() {
  const out = document.getElementById('rec-out');
  if (avisoVacio) { out.innerHTML = `<p class="rec-msg">${t('rec_empty')}</p>`; return; }
  if (!consulta || !peliculas) { out.innerHTML = ''; return; }
  if (ia && ia.consulta === consulta && ia.lang === LANG && renderIA(out)) return;

  const c = interpretar(consulta, peliculas, HOY);
  if (c.vacio) { out.innerHTML = `<p class="rec-msg">${t('rec_none_understood')}</p>`; return; }

  const { lista, exacto, mas } = recomendar(c, peliculas, libresDe, HOY);
  const entendido = `<p class="rec-understood"><span>${t('rec_understood')}</span> ${resumenCriterios(c).map(x => `<span class="tagx">${esc(x)}</span>`).join('')}</p>`;
  if (!lista.length) { out.innerHTML = entendido + `<p class="rec-msg">${t('rec_nomatch')}</p>`; return; }

  out.innerHTML = entendido + `
    <h2 class="rec-results-title">${t('rec_results')}</h2>
    ${exacto ? '' : `<p class="rec-msg">${t('rec_partial')}</p>`}
    <ol class="rec-list">${lista.map((r, i) => tarjeta(r.p, i, r.si, r.no, r.extra)).join('')}</ol>
    ${mas ? `<p class="rec-msg">${t('rec_more', { n: mas })}</p>` : ''}`;
}

// Pregunta al servicio de IA; si no hay, tarda o falla, se queda el motor local
async function preguntarIA() {
  if (!RECOMENDADOR_IA_URL || !consulta) return;
  const pedido = { consulta, lang: LANG };
  ia = { ...pedido, estado: 'pensando' };
  renderRecomendaciones();
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    const res = await fetch(RECOMENDADOR_IA_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
      body: JSON.stringify({ prompt: consulta, lang: LANG, hoy: HOY })
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error(res.status);
    const datos = await res.json();
    if (ia && ia.consulta === pedido.consulta && ia.lang === pedido.lang) ia = { ...pedido, estado: 'ok', datos };
  } catch (e) {
    if (ia && ia.consulta === pedido.consulta && ia.lang === pedido.lang) ia = { ...pedido, estado: 'error' };
  }
  renderRecomendaciones();
}

function pedirRecomendacion(texto) {
  consulta = texto.trim();
  avisoVacio = !consulta;
  try { sessionStorage.setItem('lafita-rec', consulta); } catch (e) {}
  renderRecomendaciones();
  preguntarIA();
}

document.getElementById('rec-form').addEventListener('submit', e => {
  e.preventDefault();
  pedirRecomendacion(document.getElementById('rec-q').value);
});
document.getElementById('rec-q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('rec-form').requestSubmit(); }
});
document.addEventListener('toggle', e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (k) e.target.open ? abiertos.add(k) : abiertos.delete(k);
}, true);
document.addEventListener('langchange', () => { if (ia && consulta) preguntarIA(); });

(() => {
  let inicial = new URLSearchParams(location.search).get('q');
  if (inicial == null) try { inicial = sessionStorage.getItem('lafita-rec'); } catch (e) {}
  if (inicial) { document.getElementById('rec-q').value = inicial; consulta = inicial.trim(); preguntarIA(); }
})();

function render() {
  renderRecomendaciones();
  const cont = document.getElementById('programa');
  if (!peliculas) return;
  if (!peliculas.length) { cont.innerHTML = `<p>${t('no_films')}</p>`; return; }

  // Agrupar por día, en orden
  const dias = {};
  peliculas.forEach(p => (dias[p.fecha] = dias[p.fecha] || []).push(p));

  cont.innerHTML = Object.entries(dias).map(([fecha, lista]) => `
    <section class="day">
      <h2 class="day-title">${diaCorto(fecha)}</h2>
      ${lista.map(p => `
        <article class="screening" id="f-${esc(p.id)}">
          <div class="when"><span class="time">${esc(p.hora)}</span><span class="venue">${esc(p.lugar)}</span></div>
          <div>
            ${p.poster ? `<img class="poster" src="${esc(p.poster)}" alt="">` : ''}
            <h3 class="film-title">${esc(p.titulo)}</h3>
            <p class="film-meta">${esc(p.sinopsis)}</p>
            ${p.enlaceExterno ? '' : lineaPlazas(p)}
            ${fichaPelicula(p, 'prog-')}
          </div>
          ${botonTicket(p)}
        </article>`).join('')}
    </section>`).join('');
}

async function cargarPrograma() {
  const estado = document.getElementById('estado');
  try {
    peliculas = await (await fetch('movies.json', { cache: 'no-store' })).json();
    peliculas.sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
    estado.remove();
    render();
  } catch (e) {
    estado.className = 'alert error';
    estado.removeAttribute('data-i18n');
    estado.textContent = t('error_program', { msg: e.message });
  }
}

initLangSwitch();
document.addEventListener('langchange', render);
cargarPrograma();

// Plazas ocupadas de todas las funciones, en directo
db.collection('funciones').onSnapshot(snap => {
  ocupadas = {};
  snap.forEach(d => { ocupadas[d.id] = d.data().ocupadas || 0; });
  render();
}, () => {});
</script>

</body>
</html>
