<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAFITA Tickets — Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600&family=Oswald:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a class="brand" href="index.html"><span class="wordmark">LAFITA</span><span class="tag">Tickets</span></a>
    <div class="header-right">
      <div class="lang-switch"></div>
      <div class="header-dates"><span data-i18n="admin_title_right"></span><small data-i18n="admin_sub"></small></div>
    </div>
  </div>
</header>

<main>
  <a class="back-link" href="index.html" data-i18n="back_public"></a>

  <div id="login-box" class="admin-login">
    <h2 data-i18n="login_title"></h2>
    <label for="login-email" data-i18n="lbl_login_email"></label>
    <input type="email" id="login-email" autocomplete="username">
    <label for="login-pass" data-i18n="lbl_pass"></label>
    <input type="password" id="login-pass" autocomplete="current-password">
    <div class="form-actions">
      <button class="btn" id="btn-login" data-i18n="btn_login"></button>
    </div>
    <div id="login-error"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="admin-toolbar" style="justify-content:space-between">
      <h2 class="panel-title" data-i18n="panel_title"></h2>
      <span><span id="usuario-actual" class="user-line"></span> <button class="btn secondary small" id="btn-logout" data-i18n="btn_logout"></button></span>
    </div>

    <!-- Link escondido para invitados en las funciones de München Ticket -->
    <p class="guest-link-box"><span data-i18n="admin_guest_link"></span><br><code id="link-invitados"></code></p>

    <!-- Añadir invitado a mano (también con reservas cerradas o completas) -->
    <details class="add-guest" id="add-guest">
      <summary data-i18n="add_guest_title"></summary>
      <p class="form-hint" data-i18n="add_guest_hint"></p>
      <form id="form-add-guest" novalidate>
        <label for="ag-pelicula"><span data-i18n="inv_lbl_film"></span> *</label>
        <select id="ag-pelicula" required></select>
        <div id="ag-estado" class="seats-note" hidden></div>

        <label for="ag-nombre"><span data-i18n="lbl_name"></span> *</label>
        <input type="text" id="ag-nombre" required minlength="2" maxlength="120">

        <label for="ag-email"><span data-i18n="lbl_email"></span> *</label>
        <input type="email" id="ag-email" required maxlength="160">
        <p class="form-hint" data-i18n="add_guest_email_hint"></p>

        <label for="ag-personas"><span data-i18n="lbl_people"></span> *</label>
        <select id="ag-personas" required></select>

        <div class="form-actions">
          <button type="submit" class="btn" id="ag-enviar" data-i18n="add_guest_btn"></button>
        </div>
      </form>
      <div id="ag-msg"></div>
      <div id="ag-ticket" class="hidden">
        <div id="ag-ticket-svg" class="ticket-svg"></div>
        <p class="guest-link-box"><span data-i18n="add_guest_link"></span><br><code id="ag-link"></code></p>
        <div class="ticket-actions">
          <button type="button" class="btn secondary small" id="ag-copiar" data-i18n="btn_copy"></button>
          <button type="button" class="btn secondary small" id="ag-descargar" data-i18n="btn_download"></button>
          <button type="button" class="link-btn" id="ag-cerrar" data-i18n="btn_close"></button>
        </div>
      </div>
    </details>

    <!-- Ocupación de cada función -->
    <section class="seat-section">
      <h3 class="section-title" data-i18n="seats_title"></h3>
      <div class="seat-legend">
        <span><i class="seat taken"></i><span data-i18n="legend_taken"></span></span>
        <span><i class="seat came"></i><span data-i18n="legend_came"></span></span>
        <span><i class="seat"></i><span data-i18n="legend_free"></span></span>
      </div>
      <p class="form-hint" data-i18n="filter_hint"></p>
      <div class="seat-grid" id="seat-grid"></div>
    </section>

    <div class="admin-toolbar">
      <input type="search" id="buscar" data-i18n-ph="search_ph" aria-label="Search">
      <select id="filtro-pelicula" aria-label="Film"></select>
      <select id="orden" aria-label="Sort">
        <option value="reciente" data-i18n="sort_recent"></option>
        <option value="nombre" data-i18n="sort_name"></option>
      </select>
      <button class="btn secondary" id="btn-csv" data-i18n="btn_csv"></button>
    </div>

    <div class="stat-row" id="stats"></div>
    <div id="accion-msg"></div>

    <div class="table-scroll">
      <table class="reservas">
        <thead>
          <tr>
            <th data-i18n="th_status"></th>
            <th data-i18n="th_actions"></th>
            <th data-i18n="th_code"></th>
            <th data-i18n="th_name"></th>
            <th data-i18n="th_people"></th>
            <th data-i18n="th_film"></th>
            <th data-i18n="th_email"></th>
            <th data-i18n="th_sent"></th>
          </tr>
        </thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="inner"><span>LAFITA · Team</span><span><a href="https://lafita.de">lafita.de</a></span></div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="i18n.js"></script>
<script src="ticket-art.js"></script>
<script src="plazas.js"></script>

<script>
const $ = id => document.getElementById(id);
let todas = [];            // todas las reservas (en directo)
let contadores = {};       // plazas ocupadas guardadas en "funciones" (lo que ve la web pública)
let peliculas = [];        // movies.json (solo las que usan formulario)
let usuarioActual = null;

// ---------- Login ----------
$('btn-login').addEventListener('click', async () => {
  $('login-error').innerHTML = '';
  try {
    await auth.signInWithEmailAndPassword($('login-email').value.trim(), $('login-pass').value);
  } catch (e) {
    $('login-error').innerHTML = `<div class="alert error">${escapeHtml(traducirError(e.code))}</div>`;
  }
});
$('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-login').click(); });
$('btn-logout').addEventListener('click', () => auth.signOut());

let desuscribir = [];
auth.onAuthStateChanged(user => {
  $('login-box').classList.toggle('hidden', !!user);
  $('panel').classList.toggle('hidden', !user);
  desuscribir.forEach(f => f()); desuscribir = [];
  if (!user) return;
  usuarioActual = user.email;
  $('usuario-actual').textContent = t('connected_as', { email: user.email });
  desuscribir.push(db.collection('inscripciones').orderBy('creadoEn', 'desc').onSnapshot(snap => {
    todas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
    sincronizarContadores();
  }, err => {
    $('tabla-body').innerHTML = `<tr><td colspan="8">${escapeHtml(t('err_read', { msg: err.message }))}</td></tr>`;
  }));
  desuscribir.push(db.collection('funciones').onSnapshot(snap => {
    contadores = {};
    snap.forEach(d => { contadores[d.id] = d.data().ocupadas || 0; });
    sincronizarContadores();
  }, () => {}));
});

// ---------- Cálculos ----------
function reservasDe(pid, lista = todas) { return lista.filter(r => r.peliculaId === pid); }
function ocupadasDe(pid, lista = todas) { return reservasDe(pid, lista).reduce((s, r) => s + aporta(r), 0); }
function vinieronDe(pid) {
  return reservasDe(pid).reduce((s, r) => s + llegaronDe(r), 0);
}
function esperaDe(pid) {
  return reservasDe(pid).filter(r => r.estado === 'espera').reduce((s, r) => s + (r.personas || 0), 0);
}

// Si el contador público no coincide con las reservas reales, se corrige.
// Espera 2 s para no "corregir" en medio de una reserva que aún está llegando.
let temporizadorSync = null;
function sincronizarContadores() {
  clearTimeout(temporizadorSync);
  temporizadorSync = setTimeout(sincronizarAhora, 2000);
}
function sincronizarAhora() {
  if (!usuarioActual || !peliculas.length) return;
  peliculas.forEach(p => {
    const real = ocupadasDe(p.id);
    if ((contadores[p.id] || 0) !== real) {
      contadores[p.id] = real;
      db.collection('funciones').doc(p.id).set({ ocupadas: real }).catch(() => {});
    }
  });
}

// ---------- Acciones del equipo ----------
// Cambia una reserva y deja el contador de su función al día, todo junto.
async function aplicar(r, cambios, borrar) {
  $('accion-msg').innerHTML = '';
  const nueva = borrar ? null : Object.assign({}, r, cambios);
  // Los campos que se borran (FieldValue.delete) no cuentan para el cálculo local
  const BORRAR = firebase.firestore.FieldValue.delete();
  if (nueva) Object.keys(cambios).forEach(k => {
    const v = cambios[k];
    if (v && typeof v.isEqual === 'function' && v.isEqual(BORRAR)) delete nueva[k];
  });
  const lista = todas.filter(x => x.id !== r.id).concat(nueva ? [nueva] : []);
  const ocup = ocupadasDe(r.peliculaId, lista);
  const p = peliculas.find(x => x.id === r.peliculaId);
  if (nueva && aporta(nueva) > aporta(r) && ocup > topeEquipo(p)) {
    mostrarAviso('error', t('err_full_promote'));
    return;
  }
  const batch = db.batch();
  const ref = db.collection('inscripciones').doc(r.id);
  if (borrar) batch.delete(ref);
  else batch.update(ref, Object.assign({}, cambios, {
    gestionadoPor: usuarioActual,
    modificadoEn: firebase.firestore.FieldValue.serverTimestamp()
  }));
  batch.set(db.collection('funciones').doc(r.peliculaId), { ocupadas: ocup });
  try { await batch.commit(); }
  catch (e) { mostrarAviso('error', t('err_generic', { msg: e.message })); }
}

// El equipo puede pasar del cupo de reservas (invitados) hasta el aforo de la sala
function topeEquipo(p) { return Math.max((p && p.aforo) || 0, capacidadDe(p)); }

// ---------- Añadir invitado ----------
// Se guarda como una reserva normal "activa", ya marcada ★ Invitado, aunque la
// función tenga las reservas cerradas o completas. No se manda correo.
let agTicket = null;
function agActual() { return peliculas.find(p => p.id === $('ag-pelicula').value); }

function pintarAddGuest() {
  const sel = $('ag-pelicula'), previo = sel.value;
  sel.innerHTML = `<option value="">${t('opt_choose')}</option>` + peliculas.map(p =>
    `<option value="${escapeHtml(p.id)}">${escapeHtml(diaCorto(p.fecha))} ${escapeHtml(p.hora)} · ${escapeHtml(p.titulo)}</option>`).join('');
  if (peliculas.some(p => p.id === previo)) sel.value = previo;
  const pers = $('ag-personas'), pPrev = pers.value || '1';
  pers.innerHTML = Array.from({ length: 10 }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
  pers.value = pPrev;
  const p = agActual(), nota = $('ag-estado');
  if (!p) { nota.hidden = true; return; }
  const ocup = ocupadasDe(p.id), aforo = topeEquipo(p);
  nota.hidden = false;
  nota.classList.toggle('full', ocup >= aforo);
  nota.textContent = t('add_guest_status', { ocup, aforo, n: Math.max(aforo - ocup, 0) });
}
$('ag-pelicula').addEventListener('change', pintarAddGuest);

function agAviso(tipo, texto) {
  $('ag-msg').innerHTML = `<div class="alert ${tipo}"></div>`;
  $('ag-msg').firstChild.textContent = texto;
}

$('form-add-guest').addEventListener('submit', async e => {
  e.preventDefault();
  $('ag-msg').innerHTML = '';
  const p = agActual();
  const nombre = $('ag-nombre').value.trim();
  const email = $('ag-email').value.trim();
  const personas = parseInt($('ag-personas').value, 10) || 1;
  if (!p) return $('ag-pelicula').focus();
  if (nombre.length < 2) return $('ag-nombre').focus();
  if (!/.+@.+\..+/.test(email)) return $('ag-email').focus();

  const total = ocupadasDe(p.id) + personas, aforo = topeEquipo(p);
  if (total > aforo && !confirm(t('add_guest_over', { total, aforo }))) return;

  const btn = $('ag-enviar');
  btn.disabled = true;
  btn.textContent = t('sending');
  try {
    const codigo = LafitaTicket.generarCodigo();
    const clave = LafitaTicket.generarClave();
    const refReserva = db.collection('inscripciones').doc(clave);
    const refFuncion = db.collection('funciones').doc(p.id);
    await db.runTransaction(async tx => {
      const f = await tx.get(refFuncion);
      const ocup = f.exists ? (f.data().ocupadas || 0) : 0;
      tx.set(refReserva, {
        codigo,
        nombreArte: LafitaTicket.nombreArte(codigo),
        peliculaId: p.id,
        peliculaTitulo: p.titulo,
        fecha: p.fecha,
        hora: p.hora,
        lugar: p.lugar,
        nombre, email, personas,
        estado: 'activa',
        invitado: true,
        gestionadoPor: usuarioActual,
        idioma: LANG,
        creadoEn: firebase.firestore.FieldValue.serverTimestamp()
      });
      tx.set(refFuncion, { ocupadas: ocup + personas });
    });
    agTicket = { codigo, clave, nombre, personas, titulo: p.titulo, fecha: p.fecha, hora: p.hora, lugar: p.lugar, estado: 'activa' };
    $('ag-ticket-svg').innerHTML = LafitaTicket.svgTicket(agTicket);
    $('ag-link').textContent = new URL('gestionar.html?clave=' + clave, location.href).href;
    $('ag-ticket').classList.remove('hidden');
    agAviso('success', t('add_guest_ok', { nombre, n: personas, titulo: p.titulo }));
    $('ag-nombre').value = ''; $('ag-email').value = ''; $('ag-personas').value = '1';
  } catch (err) {
    agAviso('error', t('err_generic', { msg: err.message }));
  } finally {
    btn.disabled = false;
    btn.textContent = t('add_guest_btn');
  }
});

$('ag-copiar').addEventListener('click', async e => {
  const texto = $('ag-link').textContent;
  try { await navigator.clipboard.writeText(texto); e.target.textContent = t('copied'); }
  catch (err) { window.prompt('', texto); }
  setTimeout(() => { e.target.textContent = t('btn_copy'); }, 2000);
});
$('ag-descargar').addEventListener('click', () => {
  if (agTicket) LafitaTicket.descargarPNG(LafitaTicket.svgTicket(agTicket), `LAFITA-invitado-${agTicket.nombre.replace(/[^\w-]+/g, '_')}.png`);
});
$('ag-cerrar').addEventListener('click', () => {
  agTicket = null;
  $('ag-ticket').classList.add('hidden');
  $('ag-msg').innerHTML = '';
});

function mostrarAviso(tipo, texto) {
  $('accion-msg').innerHTML = `<div class="alert ${tipo}"></div>`;
  $('accion-msg').firstChild.textContent = texto;
}

$('tabla-body').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const r = todas.find(x => x.id === b.dataset.id); if (!r) return;
  const del = firebase.firestore.FieldValue.delete();
  switch (b.dataset.act) {
    case 'vino':     return aplicar(r, { asistencia: 'vino', llegaron: r.personas || 0 });
    case 'no_vino':  return aplicar(r, { asistencia: 'no_vino', llegaron: del, liberado: del });
    // Llegó una persona más (si ya están todas, la reserva queda como "vino")
    case 'mas1': {
      const n = Math.min(llegaronDe(r) + 1, r.personas || 0);
      return aplicar(r, { llegaron: n, asistencia: n >= (r.personas || 0) ? 'vino' : 'parcial' });
    }
    // Las que faltan ya no vienen: sus plazas quedan libres
    case 'liberar':  return aplicar(r, { asistencia: 'vino', liberado: true });
    case 'deshacer': return aplicar(r, { asistencia: del, llegaron: del, liberado: del });
    case 'confirmar':return aplicar(r, { estado: 'activa' });
    case 'cancelar': if (confirm(t('confirm_cancel_staff'))) aplicar(r, { estado: 'cancelada' }); return;
    case 'borrar':   if (confirm(t('confirm_delete'))) aplicar(r, null, true); return;
    // Invitado especial: solo una marca para el equipo (no cambia plazas ni lo ve el público)
    case 'invitado': return aplicar(r, { invitado: r.invitado ? del : true });
  }
});

// ---------- Pintar ----------
function actualizarFiltro() {
  const select = $('filtro-pelicula');
  const previo = select.value;
  select.innerHTML = `<option value="">${t('all_films')}</option><option value="__invitados">${t('only_guests')}</option>` +
    peliculas.map(p => `<option value="${escapeHtml(p.id)}">${escapeHtml(diaCorto(p.fecha))} ${escapeHtml(p.hora)} · ${escapeHtml(p.titulo)}</option>`).join('');
  select.value = previo === '__invitados' || peliculas.some(p => p.id === previo) ? previo : '';
}

function renderAsientos() {
  const filtro = $('filtro-pelicula').value;
  $('seat-grid').innerHTML = peliculas.map(p => {
    const cap = capacidadDe(p), ocup = ocupadasDe(p.id), vino = Math.min(vinieronDe(p.id), ocup), espera = esperaDe(p.id);
    // Más allá del cupo de reservas: invitados añadidos por el equipo (hasta el aforo); en rojo solo si pasa del aforo
    const tope = topeEquipo(p);
    const asientos = Array.from({ length: Math.max(cap, ocup) }, (_, i) =>
      `<i class="seat${i < vino ? ' came' : i < ocup ? ' taken' : ''}${i >= tope ? ' over' : i >= cap ? ' extra' : ''}"></i>`).join('');
    return `<button type="button" class="seat-card${filtro === p.id ? ' active' : ''}${ocup >= cap ? ' full' : ''}" data-pid="${escapeHtml(p.id)}">
      <span class="seat-when">${escapeHtml(diaCorto(p.fecha))} · ${escapeHtml(p.hora)} · ${escapeHtml(p.lugar)}</span>
      <span class="seat-film">${escapeHtml(p.titulo)}</span>
      ${p.enlaceExterno ? `<span class="seat-guest-tag">${t('seat_guests_only')}</span>` : ''}
      <span class="seats">${asientos}</span>
      <span class="seat-count"><strong>${t('seats_count', { n: ocup, cap })}</strong>${espera ? ` · ${t('waitlist_count', { n: espera })}` : ''}</span>
    </button>`;
  }).join('');
}
$('seat-grid').addEventListener('click', e => {
  const c = e.target.closest('.seat-card'); if (!c) return;
  $('filtro-pelicula').value = $('filtro-pelicula').value === c.dataset.pid ? '' : c.dataset.pid;
  render();
});

function filtradas() {
  const filtro = $('filtro-pelicula').value;
  const soloInvitados = filtro === '__invitados', pid = soloInvitados ? '' : filtro;
  const q = normalizar($('buscar').value);
  const lista = todas.filter(r => (!pid || r.peliculaId === pid) && (!soloInvitados || r.invitado) &&
    (!q || normalizar([r.codigo, r.nombre, r.email, r.nombreArte, r.invitado ? t('guest_badge') : ''].join(' ')).includes(q)));
  // Orden: por defecto las más recientes primero (como llegan de Firebase); o por nombre A–Z
  if ($('orden').value === 'nombre')
    lista.sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), undefined, { sensitivity: 'base' }));
  return lista;
}

function estadoHtml(r) {
  if (r.estado === 'cancelada') return `<span class="pill cancel">${t('status_cancelled')}</span>`;
  if (r.estado === 'espera') return `<span class="pill wait">${t('status_waitlist')}</span>`;
  const n = r.personas || 0, k = llegaronDe(r);
  if (r.asistencia === 'parcial') return `<span class="pill partial">${t('att_partial', { k, n })}</span>`;
  if (r.asistencia === 'vino' && k < n) return `<span class="pill came">${t('att_partial', { k, n })}</span><div class="sub">${t('att_released', { n: n - k })}</div>`;
  if (r.asistencia === 'vino') return `<span class="pill came">${t('att_came')}</span>`;
  if (r.asistencia === 'no_vino') return `<span class="pill noshow">${t('att_noshow')}</span>`;
  return `<span class="pill ok">${t('status_active')}</span>`;
}

function accionesHtml(r) {
  const b = (act, txt, cls = '') => `<button type="button" class="act ${cls}" data-act="${act}" data-id="${escapeHtml(r.id)}">${txt}</button>`;
  let h = '';
  const n = r.personas || 0, k = llegaronDe(r);
  if (r.estado === 'activa' && !r.asistencia) {
    h += b('vino', n > 1 ? t('act_came_all', { n }) : t('act_came'), 'ok');
    if (n > 1) h += b('mas1', t('act_plus1'));
    h += b('no_vino', t('act_noshow'), 'no') + b('cancelar', t('act_cancel'));
  }
  else if (r.estado === 'activa' && r.asistencia === 'parcial')
    h += b('mas1', t('act_plus1'), 'ok') + b('liberar', t('act_release', { n: n - k }), 'no') + b('deshacer', t('act_undo'));
  else if (r.estado === 'activa') h += b('deshacer', t('act_undo'));
  else if (r.estado === 'espera') h += b('confirmar', t('act_promote'), 'ok') + b('cancelar', t('act_cancel'));
  if (r.estado !== 'cancelada') h += b('invitado', r.invitado ? t('btn_unguest') : `★ ${t('btn_guest')}`, 'guest');
  h += b('borrar', t('act_delete'), 'danger');
  return `<div class="acts">${h}</div>`;
}

function render() {
  actualizarFiltro();
  pintarAddGuest();
  renderAsientos();
  const datos = filtradas();
  $('tabla-body').innerHTML = datos.map(r => `
    <tr class="${r.estado === 'cancelada' ? 'is-cancelled' : ''}${r.asistencia === 'parcial' ? ' is-partial' : ''}${r.asistencia === 'no_vino' ? ' is-noshow' : ''}${r.invitado ? ' is-guest' : ''}">
      <td>${estadoHtml(r)}</td>
      <td>${accionesHtml(r)}</td>
      <td><div class="code-cell"><span class="mini-arte">${LafitaTicket.svgArte(r.codigo || r.id, 60)}</span>
        <span><span class="codigo">${escapeHtml(r.codigo || r.id)}</span><br><span class="nombre-arte">${escapeHtml(r.nombreArte || LafitaTicket.nombreArte(r.codigo || r.id))}</span></span></div></td>
      <td>${escapeHtml(r.nombre)}${r.invitado ? ` <span class="pill guest">★ ${t('guest_badge')}</span>` : ''}</td>
      <td class="num">${r.personas || 0}</td>
      <td>${escapeHtml(r.peliculaTitulo)}<div class="sub">${r.fecha ? diaCorto(r.fecha) : ''} ${escapeHtml(r.hora)}</div></td>
      <td>${escapeHtml(r.email)}</td>
      <td class="sub">${formatearTimestamp(r.creadoEn)}</td>
    </tr>`).join('') || `<tr><td colspan="8">${t('none_match')}</td></tr>`;

  const activas = datos.filter(r => r.estado === 'activa');
  const suma = l => l.reduce((s, r) => s + (r.personas || 0), 0);
  $('stats').innerHTML = `
    <div class="stat-box"><div class="num">${activas.length}</div><div class="label">${t('stat_res')}</div></div>
    <div class="stat-box"><div class="num">${suma(activas)}</div><div class="label">${t('stat_people')}</div></div>
    <div class="stat-box"><div class="num">${activas.reduce((s, r) => s + llegaronDe(r), 0)}</div><div class="label">${t('stat_came')}</div></div>
    <div class="stat-box"><div class="num">${suma(datos.filter(r => r.estado === 'espera'))}</div><div class="label">${t('stat_waitlist')}</div></div>
    <div class="stat-box"><div class="num">${datos.filter(r => r.estado === 'cancelada').length}</div><div class="label">${t('stat_cancelled')}</div></div>
    <div class="stat-box"><div class="num">${suma(activas.filter(r => r.invitado))}</div><div class="label">${t('stat_guests')}</div></div>`;
}

$('filtro-pelicula').addEventListener('change', render);
$('orden').addEventListener('change', render);
$('buscar').addEventListener('input', render);

// ---------- CSV ----------
$('btn-csv').addEventListener('click', () => {
  const filas = [['Codigo', 'Estado', 'Asistencia', 'Invitado', 'Nombre arte', 'Nombre', 'Email', 'Personas', 'Llegaron', 'Pelicula', 'Fecha funcion', 'Hora', 'Enviado']];
  filtradas().forEach(r => filas.push([
    r.codigo || r.id, r.estado || 'activa', r.asistencia || '', r.invitado ? 'si' : '', r.nombreArte || '', r.nombre || '', r.email || '',
    r.personas || 0, llegaronDe(r), r.peliculaTitulo || '', r.fecha || '', r.hora || '', formatearTimestamp(r.creadoEn)
  ]));
  const csv = filas.map(f => f.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = `reservas-lafita-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

// ---------- Utilidades ----------
function normalizar(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function formatearTimestamp(ts) { return ts && ts.toDate ? ts.toDate().toLocaleString(LANG) : ''; }
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function traducirError(code) {
  return ({
    'auth/invalid-credential': t('login_bad'),
    'auth/wrong-password': t('login_bad'),
    'auth/user-not-found': t('login_nouser'),
    'auth/invalid-email': t('login_badmail')
  })[code] || t('login_other', { msg: code });
}

$('link-invitados').textContent = new URL('invitados.html', location.href).href;

initLangSwitch();
document.addEventListener('langchange', () => {
  if (usuarioActual) $('usuario-actual').textContent = t('connected_as', { email: usuarioActual });
  render();
});
fetch('movies.json', { cache: 'no-store' }).then(r => r.json()).then(list => {
  // También las de München Ticket: ahí solo cuentan los sitios de invitados (máx. 10)
  peliculas = list.filter(p => !p.soloTaquilla).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  render();
  sincronizarContadores();
}).catch(() => {});
</script>
