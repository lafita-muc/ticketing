CONTACTO = "ticket@lafita.de"
# Firebase (los mismos datos públicos que firebase-config.js)
FIREBASE_PROJECT = "lafita26-4dd5b"
FIREBASE_API_KEY = "AIzaSyD_mhwFkkb3JHH0hoZOgoWtpw3VAAhLyTE"

