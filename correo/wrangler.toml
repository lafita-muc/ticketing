name = "lafita-correo"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Qué web puede llamar a este servicio (la dirección de la web de tickets)
ORIGEN_PERMITIDO = "https://lafita-muc.github.io"
# Dirección de la web de tickets (para el enlace "ver / cambiar / cancelar")
WEB_URL = "https://lafita-muc.github.io/ticketing"
